version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:13
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sofka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Passw0rd.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ms-eureka:
    build:
      context: ./ms-eureka
      dockerfile: Dockerfile
    container_name: ms-eureka
    ports:
      - "8761:8761"
    depends_on:
      - rabbitmq
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: uat

  ms-customers:
    build:
      context: ./ms-customers
      dockerfile: Dockerfile
    container_name: ms-customers
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq
      - ms-eureka
      - postgres
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: uat
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://ms-eureka:8761/eureka/

  ms-accounts:
    build:
      context: ./ms-accounts
      dockerfile: Dockerfile
    container_name: ms-accounts
    ports:
      - "8082:8082"
    depends_on:
      - rabbitmq
      - ms-eureka
      - postgres
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: uat
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://ms-eureka:8761/eureka/

volumes:
  rabbitmq_data:
  postgres_data: 